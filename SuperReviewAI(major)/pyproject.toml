[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-review-intelligence-platform"
version = "0.1.0"
description = "A production-oriented platform for customer review intelligence."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115,<0.116",
    "faiss-cpu>=1.13,<2",
    "matplotlib>=3.9,<4",
    "pandas>=2.2,<3",
    "pydantic>=2.9,<3",
    "python-multipart>=0.0.9,<0.1",
    "scikit-learn>=1.5,<1.6",
    "sentence-transformers>=5.2,<6",
    "torch>=2.2,<2.3",
    "transformers>=4.57,<5",
    "uvicorn[standard]>=0.30,<0.31",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<0.29", "pytest>=8.3,<9", "ruff>=0.6,<0.7"]

[tool.setuptools.packages.find]
include = ["backend*", "ml*"]

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
python_files = ["test_*.py"]
addopts = "-ra"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["data", "artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
